<ng-container
  *ngIf="{
    isMobile: isMobile$ | async,
    language: language$ | async
  } as info"
>
  <footer class="footer">
    <div class="footer-container">
      <p class="footer-container__copyright">
        {{ copyright[info.language!] + " " }}&#174;
        {{ " " + date + " " + name }}
      </p>
      <a
        [href]="certificationUrl"
        [target]="'_blank'"
        rel="noopener noreferrer"
        class="footer-container__certification"
      >
        <img
          src="../../../../assets/logos/insignia.svg"
          alt="insignia certificacion mercado pago developer"
          loading="lazy"
        />
      </a>
    </div>
  </footer>
</ng-container>
