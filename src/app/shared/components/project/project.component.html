<ng-container *ngIf="{ language: language$ | async } as info">
  <div class="project" [ngClass]="{ home: fromHome }">
    <div class="project__info">
      <h2 class="project__info-title mt-2" [ngClass]="{ home: fromHome }">
        {{ fromHome ? homeTitle[info.language!] : title[info.language!] }}
      </h2>
      <div class="project__info-container">
        <swiper
          [config]="swiperConfig"
          [navigation]="{
            nextEl: '.right',
            prevEl: '.left'
          }"
          [autoplay]="{ delay: isMobile ? 3000 : 6000 }"
          [loop]="true"
        >
          <ng-container *ngFor="let item of projects">
            <ng-template swiperSlide>
              <div class="project-card hover-lift">
                <img
                  [src]="item?.principalImage"
                  [alt]="item.title"
                  class="principal-image"
                  loading="lazy"
                />
                <div class="principal-image__logo glass-panel">
                  <div class="principal-image__logo-container">
                    <img [src]="item.image" [alt]="item.title" loading="lazy" />
                    <p class="principal-image__logo-container-title">{{ item.title }}</p>
                    <a
                      [href]="item.url"
                      [target]="item.target"
                      rel="noopener noreferrer"
                      class="project__info-container-item__link"
                    >
                      {{ viewSite[info.language!] }}
                      <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
                    </a>
                  </div>
                </div>
              </div>
            </ng-template>
          </ng-container>
        </swiper>
        <div class="left">
          <i class="fas fa-chevron-left"></i>
        </div>
        <div class="right">
          <i class="fas fa-chevron-right"></i>
        </div>
      </div>
    </div>
  </div>
</ng-container>
