<div class="skills hide-on-init" [ngClass]="{ home: fromHome }" animateOnScroll animationName="animate__animated">
  <div class="skills__title">
    <h2 class="skills__title-value" [ngClass]="{ home: fromHome }">Skills</h2>
  </div>
  <div
    class="skills__items"
    [ngClass]="{ home: fromHome }"
    *ngFor="let item of skills; let i = index"
    [style.transition-delay]="(i * 40) + 'ms'"
  >
    <div
      class="skills__items-background"
      [ngClass]="{ spartacus: item.alt == 'Sap Spartacus Icon' }"
    >
      <img
        [src]="item.icon"
        [alt]="item.alt"
        loading="lazy"
        width="48"
        [ngClass]="{ spartacus: item.alt == 'Sap Spartacus Icon' }"
      />
    </div>
    <span class="skills__items-text">{{ item.label }}</span>
  </div>
</div>
