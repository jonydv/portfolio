<ng-container *ngIf="{ language: language$ | async } as info">
  <div class="curriculum__header">
    <jdv-profile-image
      class="animate__animated animate__pulse"
    ></jdv-profile-image>
    <div class="curriculum__header-personal">
      <h1
        class="curriculum__header-personal__name animate__animated animate__fadeInDown"
      >
        {{ name }}
      </h1>
      <h3
        class="curriculum__header-personal__position animate__animated animate__fadeInDown"
      >
        {{ position[info.language!] }}
      </h3>
    </div>
  </div>
  <div class="curriculum">
    <section class="curriculum__left">
      <jdv-contact></jdv-contact>
      <jdv-skills></jdv-skills>
    </section>
    <section class="curriculum__right">
      <jdv-education></jdv-education>
      <jdv-experience></jdv-experience>

      <jdv-project [isMobile]="(isMobile$ | async)!"></jdv-project>

      <div class="curriculum__goals">
        <h3 class="curriculum__goals-title">{{ goalsTitle[info.language!] }}</h3>
        <div class="curriculum__goals-grid">
          <div
            class="curriculum__goals-item glass-panel"
            animateOnScroll
            animationName="animate__animated animate__fadeInUp animate__fast"
            *ngFor="let goal of goals"
          >
            <i [class]="goal.icon"></i>
            <p>{{ goal.text[info.language!] }}</p>
          </div>
        </div>
      </div>
    </section>
  </div>
</ng-container>
